[package]
name = "recall"
version = "0.8.0"
edition = "2024"
rust-version = "1.85"
description = "Local-first agentic memory: file-backed memories with a keyword/FTS5 index and an in-process semantic embedder."
license = "MIT OR Apache-2.0"
repository = "https://github.com/j0yen/wintermute"
publish = false

[[bin]]
name = "recall"
path = "src/main.rs"

[[bin]]
name = "recalld"
path = "src/bin/recalld.rs"

[lib]
name = "recall"
path = "src/lib.rs"

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_must_use = "deny"
unreachable_pub = "warn"

[lints.clippy]
# Strict everyday lints
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# BAD_RUST-aligned restrictions: error on dishonest patterns.
# A CLI binary legitimately prints to stdout/stderr — `print_stdout` /
# `print_stderr` therefore have to be `allow` at the crate level. The
# remaining restrictions stay deny; tests opt out per-module via
# `#[allow(clippy::unwrap_used, clippy::expect_used)]`.
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "deny"
unimplemented = "deny"
unreachable = "warn"
indexing_slicing = "warn"
mem_forget = "deny"
as_conversions = "warn"
float_arithmetic = "warn"
dbg_macro = "deny"
print_stdout = "allow"
print_stderr = "allow"

# Tame pedantic noise without weakening BAD_RUST coverage
module_name_repetitions = "allow"
missing_errors_doc = "warn"
missing_panics_doc = "warn"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "abort"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
directories = "5"
fastembed = "4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "signal", "sync", "time"] }
toml = "0.8"
ulid = { version = "1.1", features = ["serde"] }
walkdir = "2"

[dev-dependencies]
proptest = "1"
tempfile = "3"
